<text x="330.4444" y="199.321" font-size="26" text-anchor="start" fill="#172d3c">y</text>
<text x="153.8889" y="511.1852" font-size="26" text-anchor="start" fill="#172d3c">(−h,−H)</text>
<text x="236.6667" y="203.5185" font-size="26" text-anchor="middle" fill="#172d3c">+∞</text>
<text x="589.8889" y="437.8148" font-size="26" text-anchor="middle" fill="#172d3c">+∞</text>
<text x="240" y="438.0247" font-size="30" text-anchor="middle" fill="#172d3c">G₁</text>
<text x="715" y="195" font-size="28" text-anchor="start" fill="#172d3c">h,H&gt;0；w=x+iy</text>
<text x="715" y="237" font-size="28" text-anchor="start" fill="#172d3c">x&gt;−h，y&gt;−H</text>
<text x="715" y="279" font-size="28" text-anchor="start" fill="#172d3c">并且 x&lt;0 或 y&lt;0。</text>
<text x="715" y="345" font-size="27" text-anchor="start" fill="#172d3c" font-weight="600">排除的四条边界：</text>
<text x="715" y="390" font-size="27" text-anchor="start" fill="#172d3c">x=−h，y≥−H</text>
<text x="715" y="432" font-size="27" text-anchor="start" fill="#172d3c">y=−H，x≥−h</text>
<text x="715" y="474" font-size="27" text-anchor="start" fill="#172d3c">y=0，x≥0</text>
<text x="715" y="516" font-size="27" text-anchor="start" fill="#172d3c">x=0，y≥0</text>
<text x="70" y="590" font-size="25" text-anchor="start" fill="#788994">向上、向右两个通道开放；长度只作示意，未固定 h/H。</text>
