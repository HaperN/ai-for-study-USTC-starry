<rect width="1120" height="1390" fill="white"/><g font-family="&#x27;STIX Two Text&#x27;,&#x27;Cambria Math&#x27;,&#x27;Times New Roman&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,serif" fill="#172d3c">
<text x="35" y="45" font-size="36" text-anchor="start" fill="#172d3c" font-weight="600">图 8.26 · 两个开多边形域</text>
<text x="35" y="85" font-size="26" text-anchor="start" fill="#172d3c">蓝色为域内；虚线边界均不含。箭头仅表示无限延伸，图边缘不是边界。</text>
<text x="35" y="140" font-size="31" text-anchor="start" fill="#172d3c" font-weight="600">（1）直角转弯域 G₁</text>
