<!--
  模板：推导对照书页（用户确认，2026-10-14）
  ────────────────────────────────────────────────────────────────
  渲染策略  纯静态 SPA：数据在 data/data.js 里（window.__DATA__），
            <script> 加载而不是 fetch()，所以从 file:// 双击打开也能用。
  数据来源  blocks/parse（chapters/concepts/images）+ blocks/clean（latex/）
            + blocks/lesson（lessons/），由 blocks/render/build.py 拼成一份。
  交互模型  有 canvas 模型时才注入 MathBox（three.js 本地文件，1.1MB，不白给）；
            symbolic 模型只用 KaTeX 排版 + 分步按钮。规格 → 图元由 assets/models.js 做。
  启用特性  目录导航 + hash 路由（#/<单元id>、#concept=<概念id>）、
            当前正文的概念、性质和解释以可拖动浮窗对照，关闭返回原句；兼容旧概念链接、
            原文可折叠对照（还能切到扫描 OCR 原始版）、
            插图按 bbox 裁好直接显示、公式用本地 KaTeX 排版。
  离线      全部资源（含字体）都在本目录，零网络请求。
  换皮      改 assets/styles.css 或本文件的骨架，重新 build 即可，数据不动。
-->
